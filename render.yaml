services:
  - type: web
    name: knowwhereyoulack-backend
    runtime: docker
    rootDir: java-backend
    plan: free
    branch: main
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 8082
