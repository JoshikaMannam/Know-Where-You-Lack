services:
  - type: web
    name: knowwhereyoulack-backend
    env: java
    rootDir: java-backend
    buildCommand: mvn clean install -DskipTests
    startCommand: java -jar target/backend-1.0.0.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 8082
